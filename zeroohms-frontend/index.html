<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="favicon" type="image/svg+xml" href="/logos/favicons/favicon_light.svg" />

    <script>
      // Cambia el favicon segun el tema del sistema. El atributo media en <link>
      // no funciona en Safari y el navegador cachea los favicons con fuerza.
      const favicon = document.getElementById("favicon");
      const dark = matchMedia("(prefers-color-scheme: dark)");
      const apply = () => {
        favicon.href = `/logos/favicons/favicon_${dark.matches ? "dark" : "light"}.svg?v=2`;
      };
      dark.addEventListener("change", apply);
      apply();
    </script>
